openapi: 3.0.3
info:
  title: tserver Test Results API
  version: 1.0.0
  description: Authenticated gateway that synchronously forwards test-result requests to the Python API.
servers:
  - url: http://localhost:8080
paths:
  /api/test-results:
    post:
      operationId: getTestResults
      summary: Get test results for an application version
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestResultsRequest'
            example:
              application: inventory
              version: 1.2.3
      responses:
        '2XX':
          description: Valid JSON response forwarded from the Python API.
          content:
            application/json:
              schema: {}
        '3XX':
          description: Valid JSON response forwarded from the Python API; redirects are not followed.
          content:
            application/json:
              schema: {}
        '4XX':
          description: Valid JSON client response forwarded from the Python API.
          content:
            application/json:
              schema: {}
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TestResultsRequest:
      type: object
      additionalProperties: false
      required: [application, version]
      properties:
        application:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 128
  responses:
    Error:
      description: JSON error response.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
